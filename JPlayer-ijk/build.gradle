apply plugin: 'com.android.library'
apply from: "$rootDir/gradle/publish.gradle"
apply from: '../constants.gradle'

android {
    namespace "top.jessi.videoplayer.ijk"
    compileSdkVersion project.ext.compileSdkVersion
    buildToolsVersion project.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion
        consumerProguardFiles 'consumer-proguard-rules.pro'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    compileOnly 'androidx.annotation:annotation:1.1.0'
    // NextLib：通过 FFmpeg 获取媒体详细信息（音轨、字幕轨等元数据）
    // 使用 api 而非 implementation，使依赖 JPlayer-java 的模块也能访问
    // api files('src/main/libs/nextlib-mediainfo-1.10.1-0.13.0.aar')
    implementation "io.github.anilbeesetti:nextlib-mediainfo:1.10.1-0.13.0"
    implementation project(':JPlayer-java')
    api("com.github.LeoJessi.IJKPlayer:IJKPlayer:1.4.1")
}